<!--
  Theme sync: the Chirpy mode toggle only sets `data-mode`, but Chirpy core and
  Bootstrap 5.3 theme off `data-bs-theme` (absent => dark default + color-scheme:dark).
  Mirror data-mode -> data-bs-theme so the whole page (core UI, tables, canvas,
  scrollbars, Bootstrap components) fully follows light/dark.
-->
<script>
  (function () {
    var html = document.documentElement;
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function resolve() {
      var mode = html.getAttribute('data-mode');
      if (mode === 'dark' || mode === 'light') return mode;
      return mq.matches ? 'dark' : 'light'; // following system
    }
    function sync() {
      var theme = resolve();
      if (html.getAttribute('data-bs-theme') !== theme) {
        html.setAttribute('data-bs-theme', theme);
      }
    }
    sync();
    new MutationObserver(sync).observe(html, {
      attributes: true,
      attributeFilter: ['data-mode']
    });
    mq.addEventListener('change', sync);
  })();
</script>
